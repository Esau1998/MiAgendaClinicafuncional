<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Horarios')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${medico != null} ? 'Horarios de Dr(a). ' + ${medico.nombre} + ' ' + ${medico.apellido} : 'Horarios'"></h3>
        <a th:href="@{/horarios/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo horario</a>
    </div>

    <a th:href="@{/medicos}" th:if="${medico != null}" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Volver a médicos</a>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th th:if="${medico == null}">Médico</th>
                <th>Día</th>
                <th>Hora inicio</th>
                <th>Hora fin</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h : ${horarios}">
                <td th:if="${medico == null}" th:text="${h.medico.nombre + ' ' + h.medico.apellido}"></td>
                <td th:text="${h.dia}"></td>
                <td th:text="${h.horaInicio}"></td>
                <td th:text="${h.horaFin}"></td>
                <td><span class="badge badge-estado" th:classappend="${h.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${h.estado}"></span></td>
                <td class="text-end">
                    <a th:href="@{/horarios/editar/{id}(id=${h.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/horarios/eliminar/{id}(id=${h.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este horario?')"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(horarios)}">
                <td colspan="6" class="text-center text-muted py-4">No hay horarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
