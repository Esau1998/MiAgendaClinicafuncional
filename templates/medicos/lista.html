<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Médicos')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Médicos</h3>
        <a th:href="@{/medicos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo médico</a>
    </div>

    <form th:action="@{/medicos}" method="get" class="mb-3 d-flex" style="max-width: 350px;">
        <input type="text" name="buscar" th:value="${buscar}" class="form-control me-2" placeholder="Buscar por nombre o apellido">
        <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
    </form>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Teléfono</th>
                <th>Nro. profesional</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${medicos}">
                <td th:text="'Dr(a). ' + ${m.nombre + ' ' + m.apellido}"></td>
                <td th:text="${m.especialidad.nombre}"></td>
                <td th:text="${m.telefono}"></td>
                <td th:text="${m.numeroProfesional}"></td>
                <td>
                    <span class="badge badge-estado" th:classappend="${m.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${m.estado}"></span>
                </td>
                <td class="text-end">
                    <a th:href="@{/medicos/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/medicos/horarios/{id}(id=${m.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-clock"></i></a>
                    <a th:href="@{/medicos/desactivar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Desactivar este médico?')"><i class="bi bi-slash-circle"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicos)}">
                <td colspan="6" class="text-center text-muted py-4">No hay médicos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
