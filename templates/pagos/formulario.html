<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Pago')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <h3 class="mb-4">Nuevo pago</h3>

    <div class="card p-4" style="max-width: 600px;">
        <form th:action="@{/pagos/guardar}" th:object="${pago}" method="post">
            <div class="mb-3">
                <label class="form-label">Cita</label>
                <select class="form-select" th:field="*{cita.id}">
                    <option th:each="c : ${citas}" th:value="${c.id}"
                            th:text="${c.fecha} + ' ' + ${c.hora} + ' — ' + ${c.paciente.nombre} + ' ' + ${c.paciente.apellido}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Paciente</label>
                <select class="form-select" th:field="*{paciente.id}">
                    <option th:each="c : ${citas}" th:value="${c.paciente.id}" th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></option>
                </select>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Monto</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{monto}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}" required>
                </div>
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label class="form-label">Método de pago</label>
                    <select class="form-select" th:field="*{metodoPago}">
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{estado}">
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="PAGADO">Pagado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Referencia</label>
                <input type="text" class="form-control" th:field="*{referencia}">
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/pagos}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
