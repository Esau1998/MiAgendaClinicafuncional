<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Pagos')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Pagos</h3>
        <a th:href="@{/pagos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo pago</a>
    </div>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Paciente</th>
                <th>Fecha</th>
                <th>Monto</th>
                <th>Método</th>
                <th>Estado</th>
                <th>Referencia</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pg : ${pagos}">
                <td th:text="${pg.paciente.nombre + ' ' + pg.paciente.apellido}"></td>
                <td th:text="${pg.fecha}"></td>
                <td th:text="'$' + ${pg.monto}"></td>
                <td th:text="${pg.metodoPago}"></td>
                <td>
                    <span class="badge badge-estado" th:classappend="${pg.estado == 'PAGADO'} ? 'bg-success' : (${pg.estado == 'CANCELADO'} ? 'bg-danger' : 'bg-warning')" th:text="${pg.estado}"></span>
                </td>
                <td th:text="${pg.referencia}"></td>
                <td class="text-end">
                    <a th:href="@{/pagos/eliminar/{id}(id=${pg.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este pago?')"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pagos)}">
                <td colspan="7" class="text-center text-muted py-4">No hay pagos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
