<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="scripts">
    <button type="button" class="btn-fondos" data-bs-toggle="offcanvas" data-bs-target="#panelFondos"
            aria-controls="panelFondos" title="Cambiar fondo" aria-label="Cambiar fondo">
        <i class="bi bi-image"></i>
    </button>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panelFondos" aria-labelledby="panelFondosTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="panelFondosTitulo"><i class="bi bi-image"></i> Fondo de pantalla</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
            <p class="text-muted small">Elige una imagen, sube la tuya o pega un enlace. Se guarda en este navegador.</p>
            <div class="fondos-grid mb-3" id="fondosGrid"></div>

            <label class="form-label" for="fondoArchivo">Subir mi propia imagen</label>
            <input type="file" class="form-control mb-3" id="fondoArchivo" accept="image/*">

            <label class="form-label" for="fondoUrl">O pegar la URL de una imagen</label>
            <div class="input-group mb-3">
                <input type="url" class="form-control" id="fondoUrl" placeholder="https://...">
                <button type="button" class="btn btn-primary" id="fondoUrlAplicar">Usar</button>
            </div>

            <label class="form-label" for="fondoVelo">Oscurecer fondo</label>
            <input type="range" class="form-range" id="fondoVelo" min="0" max="85" value="30">

            <label class="form-label" for="fondoBlur">Desenfocar fondo</label>
            <input type="range" class="form-range mb-3" id="fondoBlur" min="0" max="16" value="0">

            <button type="button" class="btn btn-outline-secondary w-100" id="fondoReset">
                <i class="bi bi-arrow-counterclockwise"></i> Restablecer fondo
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/fondos.js}"></script>
</div>
</body>
</html>
