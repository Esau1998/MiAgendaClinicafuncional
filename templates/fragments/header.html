<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Mi Agenda de Clínica'">Mi Agenda de Clínica</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script>
        // Aplica el fondo guardado antes de pintar la pagina (evita parpadeos)
        (function () {
            try {
                var r = document.documentElement.style;
                var i = localStorage.getItem('mac.fondo.img');
                var v = localStorage.getItem('mac.fondo.velo');
                var b = localStorage.getItem('mac.fondo.blur');
                if (i) r.setProperty('--fondo-img', 'url("' + i.replace(/"/g, '%22') + '")');
                if (v !== null) r.setProperty('--fondo-velo', v);
                if (b !== null) r.setProperty('--fondo-blur', b + 'px');
            } catch (e) { }
        })();
    </script>
</head>
</html>
