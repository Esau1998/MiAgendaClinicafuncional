<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Pacientes')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Pacientes</h3>
        <a th:href="@{/pacientes/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo paciente</a>
    </div>

    <form th:action="@{/pacientes}" method="get" class="mb-3 d-flex" style="max-width: 350px;">
        <input type="text" name="buscar" th:value="${buscar}" class="form-control me-2" placeholder="Buscar por nombre o apellido">
        <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
    </form>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pacientes}">
                <td th:text="${p.nombre + ' ' + p.apellido}"></td>
                <td th:text="${p.telefono}"></td>
                <td th:text="${p.correo}"></td>
                <td>
                    <span class="badge badge-estado" th:classappend="${p.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${p.estado}"></span>
                </td>
                <td class="text-end">
                    <a th:href="@{/pacientes/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/pacientes/historial/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-file-earmark-medical"></i></a>
                    <a th:href="@{/pacientes/citas/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-calendar-check"></i></a>
                    <a th:href="@{/pacientes/desactivar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Desactivar este paciente?')"><i class="bi bi-slash-circle"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="5" class="text-center text-muted py-4">No hay pacientes registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
