<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Tratamientos')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Tratamientos</h3>
        <a th:href="@{/tratamientos/nuevo(historialId=${historial.id})}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo tratamiento</a>
    </div>

    <a th:href="@{/pacientes/historial/{id}(id=${historial.paciente.id})}" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Volver al historial</a>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Medicamento</th>
                <th>Dosis</th>
                <th>Frecuencia</th>
                <th>Duración</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tratamientos}">
                <td th:text="${t.medicamento}"></td>
                <td th:text="${t.dosis}"></td>
                <td th:text="${t.frecuencia}"></td>
                <td th:text="${t.duracion}"></td>
                <td class="text-end">
                    <a th:href="@{/tratamientos/eliminar/{id}(id=${t.id},historialId=${historial.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este tratamiento?')"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tratamientos)}">
                <td colspan="5" class="text-center text-muted py-4">No hay tratamientos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
