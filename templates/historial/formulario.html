<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Registro clínico')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <h3 class="mb-4">Nuevo registro clínico</h3>

    <div class="card p-4" style="max-width: 650px;">
        <form th:action="@{/historial/guardar}" th:object="${historial}" method="post">
            <div class="mb-3">
                <label class="form-label">Paciente</label>
                <select class="form-select" th:field="*{paciente.id}">
                    <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellido}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Médico</label>
                <select class="form-select" th:field="*{medico.id}">
                    <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nombre + ' ' + m.apellido}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" th:field="*{fecha}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Motivo</label>
                <input type="text" class="form-control" th:field="*{motivo}">
            </div>
            <div class="mb-3">
                <label class="form-label">Diagnóstico</label>
                <textarea class="form-control" th:field="*{diagnostico}" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Tratamiento (resumen)</label>
                <textarea class="form-control" th:field="*{tratamiento}" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/pacientes}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
