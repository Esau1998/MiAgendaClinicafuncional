<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="page-head">
        <div>
            <h3>Hola, <span th:text="${session.usuarioNombre}">equipo</span></h3>
            <div class="text-muted">Este es el resumen de tu clínica.</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/citas/nueva}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nueva cita</a>
            <a th:href="@{/pacientes/nuevo}" class="btn btn-outline-primary"><i class="bi bi-person-plus"></i> Nuevo paciente</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-6 col-xl-3">
            <div class="card-stat bg-azul">
                <p>Pacientes activos</p>
                <h2 th:text="${totalPacientes}">0</h2>
                <i class="bi bi-people"></i>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card-stat bg-verde">
                <p>Médicos activos</p>
                <h2 th:text="${totalMedicos}">0</h2>
                <i class="bi bi-heart-pulse"></i>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card-stat bg-naranja">
                <p>Citas de hoy</p>
                <h2 th:text="${citasHoy}">0</h2>
                <i class="bi bi-calendar-day"></i>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card-stat bg-morado">
                <p>Citas pendientes</p>
                <h2 th:text="${citasPendientes}">0</h2>
                <i class="bi bi-hourglass-split"></i>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="d-flex justify-content-between align-items-center p-3 pb-2">
            <h5 class="mb-0">Próximas citas</h5>
            <a th:href="@{/citas}" class="small fw-semibold text-decoration-none">Ver todas</a>
        </div>
        <div class="table-responsive-card">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${proximasCitas}">
                    <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(c.hora, 'HH:mm')}"></td>
                    <td th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></td>
                    <td th:text="'Dr(a). ' + ${c.medico.nombre + ' ' + c.medico.apellido}"></td>
                    <td><span class="badge badge-estado" th:classappend="${c.estado == 'CONFIRMADA'} ? 'bg-info' : 'bg-warning text-dark'" th:text="${c.estado}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(proximasCitas)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay citas próximas pendientes ni confirmadas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
