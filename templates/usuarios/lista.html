<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="page-head">
        <h3>Usuarios</h3>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
    </div>

    <div class="alert alert-success py-2 alert-autocierre" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="table-responsive-card">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nombre completo</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="fw-semibold" th:text="${u.username}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td th:text="${u.email != null ? u.email : '—'}"></td>
                    <td><span class="badge text-bg-light border" th:text="${u.rol.nombre}"></span></td>
                    <td>
                        <span class="badge badge-estado" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'" th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/usuarios/estado/{id}(id=${u.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                    th:title="${u.activo} ? 'Desactivar' : 'Activar'">
                                <i class="bi" th:classappend="${u.activo} ? 'bi-person-slash' : 'bi-person-check'"></i>
                            </button>
                        </form>
                        <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
