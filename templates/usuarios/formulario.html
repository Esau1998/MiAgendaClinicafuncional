<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Usuario')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="page-head">
        <h3 th:text="${form.id == null} ? 'Nuevo usuario' : 'Editar usuario'"></h3>
    </div>

    <div class="alert alert-danger" style="max-width: 680px;" th:if="${error}" th:text="${error}"></div>

    <div class="card p-4" style="max-width: 680px;">
        <form th:action="@{/usuarios/guardar}" th:object="${form}" method="post" autocomplete="off">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="nombreCompleto">Nombre completo</label>
                    <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" minlength="4" maxlength="30"
                           pattern="[A-Za-z0-9._\-]{4,30}" title="De 4 a 30 caracteres: letras, números, punto, guion o guion bajo" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="100">
                </div>
                <div class="col-12">
                    <label class="form-label" for="password">
                        <span th:text="${form.id == null} ? 'Contraseña' : 'Contraseña nueva (déjala vacía para conservar la actual)'"></span>
                    </label>
                    <div class="input-icono con-ojo">
                        <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="64"
                               autocomplete="new-password" data-fuerza="fuerzaUsr" th:required="${form.id == null}">
                        <button type="button" class="btn-ojo" data-ver-password="password" aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="fuerza" id="fuerzaUsr"><span></span></div>
                    <div class="fuerza-texto">Mínimo 8 caracteres, con letras y números.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="rolId">Rol</label>
                    <select class="form-select" id="rolId" th:field="*{rolId}" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="medicoId">Médico asociado <span class="text-muted fw-normal">(solo rol MEDICO)</span></label>
                    <select class="form-select" id="medicoId" th:field="*{medicoId}">
                        <option value="">-- Ninguno --</option>
                        <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nombre + ' ' + m.apellido}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}">
                        <label class="form-check-label" for="activo">Cuenta activa (puede iniciar sesión)</label>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
