<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Citas')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${paciente != null} ? 'Citas de ' + ${paciente.nombre} + ' ' + ${paciente.apellido} : 'Citas'"></h3>
        <a th:href="@{/citas/nueva}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nueva cita</a>
    </div>

    <a th:href="@{/pacientes}" th:if="${paciente != null}" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Volver a pacientes</a>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th th:if="${paciente == null}">Paciente</th>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${citas}">
                <td th:if="${paciente == null}" th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></td>
                <td th:text="'Dr(a). ' + ${c.medico.nombre + ' ' + c.medico.apellido}"></td>
                <td th:text="${c.especialidad.nombre}"></td>
                <td th:text="${c.fecha}"></td>
                <td th:text="${c.hora}"></td>
                <td>
                    <span class="badge badge-estado"
                          th:classappend="${c.estado == 'ATENDIDA'} ? 'bg-success' : (${c.estado == 'CANCELADA' || c.estado == 'NO_ASISTIO'} ? 'bg-danger' : (${c.estado == 'CONFIRMADA'} ? 'bg-info' : 'bg-warning'))"
                          th:text="${c.estado}"></span>
                </td>
                <td class="text-end">
                    <a th:href="@{/citas/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Estado</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/citas/estado/{id}/CONFIRMADA(id=${c.id})}">Confirmar</a></li>
                            <li><a class="dropdown-item" th:href="@{/citas/estado/{id}/ATENDIDA(id=${c.id})}">Marcar atendida</a></li>
                            <li><a class="dropdown-item" th:href="@{/citas/estado/{id}/CANCELADA(id=${c.id})}">Cancelar</a></li>
                            <li><a class="dropdown-item" th:href="@{/citas/estado/{id}/NO_ASISTIO(id=${c.id})}">No asistió</a></li>
                        </ul>
                    </div>
                    <a th:href="@{/historial/nuevo(pacienteId=${c.paciente.id})}" th:if="${c.estado == 'ATENDIDA'}" class="btn btn-sm btn-outline-info"><i class="bi bi-file-earmark-medical"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="7" class="text-center text-muted py-4">No hay citas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
