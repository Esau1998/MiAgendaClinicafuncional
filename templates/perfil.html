<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Mi perfil')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="contenido">
    <div class="page-head"><h3>Mi perfil</h3></div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="mb-3"><i class="bi bi-person-vcard"></i> Mis datos</h5>

                <div class="alert alert-success py-2 alert-autocierre" th:if="${exitoDatos}" th:text="${exitoDatos}"></div>
                <div class="alert alert-danger py-2" th:if="${errorDatos}" th:text="${errorDatos}"></div>

                <form th:action="@{/perfil/datos}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" th:value="${perfil.username}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <input type="text" class="form-control" th:value="${perfil.rol.nombre}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nombreCompleto">Nombre completo</label>
                        <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" maxlength="100" required th:value="${perfil.nombreCompleto}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo electrónico (para recuperar tu contraseña)</label>
                        <input type="email" class="form-control" id="email" name="email" maxlength="100" th:value="${perfil.email}">
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="mb-3"><i class="bi bi-shield-lock"></i> Cambiar contraseña</h5>

                <div class="alert alert-success py-2 alert-autocierre" th:if="${exitoPassword}" th:text="${exitoPassword}"></div>
                <div class="alert alert-danger py-2" th:if="${errorPassword}" th:text="${errorPassword}"></div>

                <form th:action="@{/perfil/password}" method="post" data-confirmar-password autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="actual">Contraseña actual</label>
                        <input type="password" class="form-control" id="actual" name="actual" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Nueva contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="64"
                               required autocomplete="new-password" data-fuerza="fuerzaPerfil">
                        <div class="fuerza" id="fuerzaPerfil"><span></span></div>
                        <div class="fuerza-texto">Mínimo 8 caracteres, con letras y números.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmar">Confirmar nueva contraseña</label>
                        <input type="password" class="form-control" id="confirmar" name="confirmar" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
