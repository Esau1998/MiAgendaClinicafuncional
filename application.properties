########################################################################
#  MI AGENDA CLINICA - application.properties
#  Ubicacion: MiAgendaClinica/src/main/resources/application.properties
#
#  Solo necesitas cambiar lo marcado con  >>> CAMBIAR <<<
#  Todo lo demas puedes dejarlo igual.
########################################################################


# ======================================================================
# 1. BASE DE DATOS (MySQL)
# ======================================================================

spring.datasource.username=${DB_USER:root}

# >>> CAMBIAR (2 de 2) <<<  Tu contrasena de MySQL, la misma de Workbench.
#     Reemplaza SOLO la palabra TU_PASSWORD. Ejemplo: ${DB_PASSWORD:1234}
spring.datasource.password=${DB_PASSWORD:Contador@2026}

# --- No tocar (a menos que MySQL use otro puerto u otro nombre de base) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mi_agenda_clinica}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================================
# 2. JPA / HIBERNATE  (no tocar)
# ======================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ======================================================================
# 3. SERVIDOR Y PAGINAS  (no tocar)
# ======================================================================
spring.application.name=MiAgendaClinica
server.port=8080
server.servlet.session.timeout=60m
server.error.include-message=never

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# ======================================================================
# 4. REGLAS DE LA APLICACION  (opcional)
# ======================================================================

# URL del sistema. Se usa para armar el enlace de "Olvide mi contrasena".
app.base-url=http://localhost:8080

# --- Crear cuenta (/registro) ---
# Permite que cualquier persona cree una cuenta.
app.registro.habilitado=true
# true  = la cuenta nueva queda activa al instante (rol RECEPCIONISTA)
# false = queda INACTIVA hasta que un administrador la active
app.registro.activar-automaticamente=true

# --- Olvide mi contrasena ---
# Minutos que dura el enlace de recuperacion.
app.recuperacion.minutos-validez=30
# true  = si NO hay correo configurado, el enlace se muestra en pantalla (desarrollo)
# false = el enlace solo se envia por correo (recomendado en produccion)
app.recuperacion.mostrar-enlace=true

# --- Datos de ejemplo ---
# true  = carga especialidades, medicos y horarios de ejemplo si la base esta vacia
# false = no carga nada
app.datos-demo=true


